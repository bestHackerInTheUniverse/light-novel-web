<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh sửa hồ sơ - OpenNovel</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="tailwind.config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
</head>
<body class="bg-stone-50 min-h-screen flex flex-col">
    <header class="sticky top-0 z-50 w-full border-b border-border-light bg-white shadow-sm">
        <div class="max-w-[1000px] mx-auto px-4 md:px-8 h-16 flex items-center justify-between">
            <a href="profile.html" class="flex items-center gap-3 text-primary hover:opacity-80">
                <span class="material-symbols-outlined text-2xl">arrow_back</span>
                <span class="text-sm font-bold">Quay lại hồ sơ</span>
            </a>
            <h1 class="text-lg font-bold text-stone-900">Chỉnh sửa hồ sơ</h1>
            <div class="w-20"></div>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center py-12 px-4">
        <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8 border border-stone-200">
            <form id="edit-profile-form" class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-stone-700 mb-2">Tên hiển thị</label>
                    <input type="text" id="edit-name" class="w-full px-4 py-3 border border-stone-200 rounded-lg outline-none focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="Nhập tên của bạn">
                </div>

                <div>
                    <label class="block text-sm font-bold text-stone-700 mb-2">Link ảnh đại diện (URL)</label>
                    <input type="text" id="edit-avatar" class="w-full px-4 py-3 border border-stone-200 rounded-lg outline-none focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="https://example.com/avatar.jpg">
                    <p class="text-xs text-stone-500 mt-1">Dán link hình ảnh từ internet</p>
                </div>

                <div>
                    <label class="block text-sm font-bold text-stone-700 mb-2">Dòng ghi chú (Bio)</label>
                    <textarea id="edit-bio" rows="4" class="w-full px-4 py-3 border border-stone-200 rounded-lg outline-none focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="Giới thiệu về bản thân..."></textarea>
                </div>

                <div class="flex gap-3 pt-6">
                    <a href="profile.html" class="flex-1 py-3 bg-stone-100 hover:bg-stone-200 text-stone-700 font-bold rounded-lg text-center transition-all">Hủy</a>
                    <button type="submit" class="flex-1 py-3 bg-primary hover:bg-primary-hover text-white font-bold rounded-lg shadow-lg transition-all">Lưu thay đổi</button>
                </div>
            </form>
        </div>
    </main>

    <script src="main.js"></script>
    <script>
        
        const currentUser = localStorage.getItem('currentUser');
        if (!currentUser) {
            alert('Vui lòng đăng nhập để chỉnh sửa hồ sơ!');
            window.location.href = 'login.html';
        }

        const storageKey = `profile_${currentUser}`;

        
        const currentData = JSON.parse(localStorage.getItem(storageKey)) || {
            name: currentUser,
            avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + currentUser,
            bio: 'Chào mừng đến với hồ sơ của tôi!'
        };

        document.getElementById('edit-name').value = currentData.name;
        document.getElementById('edit-avatar').value = currentData.avatar;
        document.getElementById('edit-bio').value = currentData.bio;

// dungf de su li dangnhap
        document.getElementById('edit-profile-form').addEventListener('submit', (e) => {
            e.preventDefault();

            const newData = {
                name: document.getElementById('edit-name').value || currentUser,
                avatar: document.getElementById('edit-avatar').value || 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + currentUser,
                bio: document.getElementById('edit-bio').value || 'Chào mừng đến với hồ sơ của tôi!'
            };

            localStorage.setItem(storageKey, JSON.stringify(newData));
            alert('Đã cập nhật hồ sơ thành công!');
            window.location.href = 'profile.html';
        });
    </script>
</body>
</html>

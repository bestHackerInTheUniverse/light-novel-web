<!DOCTYPE html>
<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>OpenNovel - Quên mật khẩu</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="tailwind.config.js"></script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-foreground font-display min-h-screen flex flex-col overflow-x-hidden selection:bg-primary selection:text-white transition-colors duration-300">
<header class="w-full border-b border-solid border-border-light bg-surface-light sticky top-0 z-50">
<div class="max-w-[1280px] mx-auto px-4 sm:px-10 h-16 flex items-center justify-between whitespace-nowrap">
<div class="flex items-center gap-2.5 text-foreground group cursor-pointer">
<div class="h-10 w-10 rounded-lg overflow-hidden bg-stone-100 flex items-center justify-center transition-transform group-hover:scale-110 duration-300">
<img src="https://phucma.com.vn/wp-content/uploads/2017/11/bishojyo07.gif" alt="Logo" class="h-full w-full object-contain">
</div>
<h2 class="text-xl font-extrabold leading-tight tracking-tight">OpenNovel</h2>
</div>
<div class="hidden md:flex flex-1 justify-end items-center gap-8">
<nav class="flex items-center gap-6">
<a class="text-text-muted dark:text-text-muted-dark hover:text-primary dark:hover:text-primary text-sm font-semibold transition-colors" href="index.html">Trang chủ</a>
<a class="text-text-muted dark:text-text-muted-dark hover:text-primary dark:hover:text-primary text-sm font-semibold transition-colors" href="read.html">Đọc truyện</a>
<a class="text-text-muted dark:text-text-muted-dark hover:text-primary dark:hover:text-primary text-sm font-semibold transition-colors" href="dashboard.html">Viết truyện</a>
</nav>
<div class="flex gap-3">
<button class="flex items-center justify-center overflow-hidden rounded-lg h-9 px-5 bg-primary hover:bg-primary-hover transition-colors text-white text-sm font-bold shadow-md shadow-primary/20">
<span>Đăng ký</span>
</button>
<button class="flex items-center justify-center overflow-hidden rounded-lg h-9 px-5 bg-input-bg-light dark:bg-border-dark hover:bg-border-light dark:hover:bg-[#44403c] transition-colors text-foreground dark:text-white text-sm font-bold">
<span>Đăng nhập</span>
</button>
</div>
</div>
<div class="md:hidden flex items-center text-text-main dark:text-white">
<span class="material-symbols-outlined cursor-pointer hover:text-primary transition-colors">menu</span>
</div>
</div>
</header>
<main class="flex-1 flex items-center justify-center p-4 relative z-10">
<div class="w-full max-w-[480px] flex flex-col">
<div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-0 overflow-hidden">
        <div class="px-4 py-3 border-b bg-gray-100 text-sm font-semibold">Đặt Lại Mật Khẩu</div>
        <form class="p-6" onsubmit="event.preventDefault();">
            <div class="grid grid-cols-12 gap-4 items-center">
                <label class="col-span-4 text-right text-sm text-gray-700">Địa Chỉ Email</label>
                <div class="col-span-8">
                    <input class="w-full h-10 rounded border border-gray-300 px-3 text-gray-900 placeholder-gray-400 focus:border-primary focus:ring-1 focus:ring-primary outline-none" placeholder="nhapemailcuaban@example.com" type="email"/>
                </div>
            </div>
            <div class="pt-4">
                <button class="px-6 py-2 bg-primary text-white rounded-md font-semibold shadow">Gửi đường dẫn đặt lại mật khẩu</button>
            </div>
        </form>
    </div>
<p class="text-center mt-8 text-xs font-medium text-text-muted dark:text-text-muted-dark">
                Cần giúp đỡ? <a class="text-primary hover:text-primary-hover hover:underline transition-colors" href="index.html">Liên hệ hỗ trợ</a>
</p>
</div>
</main>
<div class="pointer-events-none fixed inset-0 flex items-center justify-center overflow-hidden z-0 opacity-30 dark:opacity-10">
<div class="absolute top-[-10%] left-[-10%] w-[40vw] h-[40vw] rounded-full bg-primary blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[35vw] h-[35vw] rounded-full bg-primary blur-[100px]"></div>
</div>

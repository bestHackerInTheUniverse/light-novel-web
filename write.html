<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Trang Viết chương mới - OpenNovel</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script src="tailwind.config.js"></script>
<style>.editor-content:empty:before {
            content: attr(placeholder);
            color: #a8a29e;
            pointer-events: none;
            display: block;}::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #57534e; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #ea580c; 
        }
    </style>
</head>
<body class="bg-white font-sans text-black antialiased overflow-x-hidden min-h-screen flex flex-col transition-colors duration-200">
<header class="sticky top-0 z-50 w-full border-b border-border-dark bg-white px-4 py-3 lg:px-10 shadow-sm">
<div class="mx-auto flex max-w-[1024px] items-center justify-between">
<a href="index.html" class="brand-logo flex items-center gap-3 text-stone-900">
<img src="https://phucma.com.vn/wp-content/uploads/2017/11/bishojyo07.gif" 
    alt="Logo OpenNovel" 
    class="h-10 w-auto object-contain rounded-lg">
<h2 class="text-stone-900 text-xl font-bold leading-tight tracking-tight">OpenNovel</h2>
</a>
<div class="flex items-center gap-4 lg:gap-8">
<nav class="hidden md:flex items-center gap-8">
<a class="text-stone-300 text-sm font-medium leading-normal hover:text-primary transition-colors" href="index.html">Trang chủ</a>
<a class="text-stone-300 text-sm font-medium leading-normal hover:text-primary transition-colors" href="profile.html">Tủ sách</a>
<a class="text-primary text-sm font-bold leading-normal relative after:content-[''] after:absolute after:-bottom-1 after:left-0 after:w-full after:h-0.5 after:bg-primary after:rounded-full" href="dashboard.html">Viết truyện</a>
</nav>
<div class="flex items-center gap-2">
<div id="header-user-avatar" class="flex items-center gap-3 text-stone-700">
    <div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center"><span class="material-symbols-outlined text-sm">person</span></div>
    <span id="header-username" class="text-sm font-medium"></span>
</div>
</div>
</div>
</div>
</header>
<main class="flex-1 flex justify-center py-10 px-4 sm:px-6 lg:px-8">
<div class="w-full max-w-[800px] flex flex-col gap-8"><div class="mb-6 p-4 bg-white rounded-lg border border-border-light">
<h2 class="text-lg font-bold mb-3">Tạo truyện mới</h2>
<div class="grid gap-3">
<input id="new-title" class="form-input w-full rounded-xl border border-border-light bg-white px-4 py-3 text-base text-stone-700" placeholder="Tiêu đề truyện" />
<input id="new-author" class="form-input w-full rounded-xl border border-border-light bg-white px-4 py-3 text-base text-stone-700" placeholder="Tác giả" />
<select id="new-category" class="form-select w-full rounded-xl border border-border-light bg-white px-4 py-3 text-base text-stone-700">
<option value="Tiên Hiệp">Tiên Hiệp</option>
<option value="Ngôn Tình">Ngôn Tình</option>
<option value="Hành động">Hành động</option>
<option value="Khoa Huyễn">Khoa Huyễn</option>
<option value="Hài hước">Hài hước</option>
<option value="Phiêu Lưu">Phiêu Lưu</option>
</select>
<select id="new-status" class="form-select w-full rounded-xl border border-border-light bg-white px-4 py-3 text-base text-stone-700">
<option value="On-going">On-going</option>
<option value="Full">Full</option>
</select>
<input id="new-cover" class="form-input w-full rounded-xl border border-border-light bg-white px-4 py-3 text-base text-stone-700" placeholder="Cover image URL (optional)" />
<textarea id="new-summary" class="form-input w-full rounded-xl border border-border-light bg-white px-4 py-3 text-base text-stone-700 placeholder:text-stone-500" placeholder="Tóm tắt (tùy chọn)"></textarea>
    <div class="flex justify-end gap-3">
        <button id="publish-novel-btn" class="px-6 py-2.5 rounded-xl bg-primary hover:bg-primary-hover text-white text-sm font-bold">Đăng truyện</button>
        <button id="save-draft-novel-btn" class="px-6 py-2.5 rounded-xl bg-stone-100 hover:bg-stone-200 text-stone-700 text-sm font-bold">Lưu vào bản thảo</button>
    </div>
<div id="chapter-section" class="mt-12 pt-8 border-t border-stone-200 hidden">
    <h3 class="text-xl font-bold brand-font mb-6">Viết chương mới</h3>
    <div class="space-y-4">
        <div>
            <label class="block text-sm font-bold text-stone-700 mb-2">Chọn truyện</label>
            <select id="select-novel-target" class="w-full bg-stone-50 border-stone-200 rounded-xl focus:ring-primary focus:border-primary"></select>
        </div>
        <div>
            <label class="block text-sm font-bold text-stone-700 mb-2">Tên chương</label>
            <input id="chapter-title" type="text" placeholder="Ví dụ: Chương 1: Sự khởi đầu" class="w-full bg-stone-50 border-stone-200 rounded-xl focus:ring-primary focus:border-primary">
        </div>
        <div>
            <label class="block text-sm font-bold text-stone-700 mb-2">Nội dung</label>
            <textarea id="chapter-content" rows="15" class="w-full bg-stone-50 border-stone-200 rounded-xl focus:ring-primary focus:border-primary" placeholder="Viết nội dung chương ở đây..."></textarea>
        </div>
        <div class="flex gap-4">
            <button id="save-chapter-btn" class="flex-[2] bg-teal-600 text-white py-3 rounded-xl font-bold hover:bg-teal-700 transition-all flex items-center justify-center gap-2">
                <span class="material-symbols-outlined">publish</span>
                Cập nhật chương mới
            </button>
            <button id="save-draft-chapter-btn" class="flex-1 bg-white border border-stone-200 text-stone-600 py-3 rounded-xl font-bold hover:bg-stone-100 transition-all flex items-center justify-center gap-2">
                <span class="material-symbols-outlined">drafts</span>
                Lưu nháp chương
            </button>
        </div>
    </div>
</div>
</div>
</main>
<script>
(function(){
    const STORAGE_KEY = 'userNovels';
    const getNovels = () => JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    const saveNovels = (data) => localStorage.setItem(STORAGE_KEY, JSON.stringify(data));

    // Refresh the select used to pick a novel for chapter writing
    function refreshNovelSelect() {
        const novels = getNovels();
        const select = document.getElementById('select-novel-target');
        if (!select) return;
        if (novels.length === 0) {
            select.innerHTML = '<option value="">Bạn chưa có truyện nào</option>';
            document.getElementById('chapter-section')?.classList.add('hidden');
            return;
        }
        select.innerHTML = novels.map(n => `<option value="${n.id}">${n.title}</option>`).join('');
        document.getElementById('chapter-section')?.classList.remove('hidden');
    }

    // Create or update novel (published or draft)
    function handleCreateNovel(status) {
        const titleEl = document.getElementById('new-title');
        const title = titleEl?.value.trim();
        if (!title) return alert('Vui lòng nhập tiêu đề truyện');

        const storageKey = 'userNovels';
        const novels = JSON.parse(localStorage.getItem(storageKey) || '[]');

        const params = new URLSearchParams(window.location.search);
        const editId = params.get('novelId') || params.get('id');

        const payload = {
            id: editId || Date.now().toString(),
            title: title,
            author: document.getElementById('new-author')?.value.trim() || 'Ẩn danh',
            category: document.getElementById('new-category')?.value || '',
            status: status === 'published' ? 'published' : 'draft',
            cover: document.getElementById('new-cover')?.value.trim() || 'https://via.placeholder.com/150',
            summary: document.getElementById('new-summary')?.value.trim() || '',
            views: Number(document.getElementById('new-views')?.value) || 0,
            chapters: []
        };

        if (editId) {
            // update existing
            const idx = novels.findIndex(n => String(n.id) === String(editId));
            if (idx !== -1) {
                // preserve chapters if present
                payload.chapters = novels[idx].chapters || [];
                novels[idx] = payload;
            } else {
                novels.unshift(payload);
            }
            localStorage.setItem(storageKey, JSON.stringify(novels));
            alert(status === 'published' ? 'Cập nhật và đăng truyện thành công!' : 'Cập nhật và lưu bản nháp!');
        } else {
            novels.unshift(payload);
            localStorage.setItem(storageKey, JSON.stringify(novels));
            alert(status === 'published' ? 'Đã đăng truyện thành công!' : 'Đã lưu bản thảo truyện!');
        }

        refreshNovelSelect();
        // After saving, navigate back to profile draft section
        window.location.href = 'profile.html#drafts';
    }

    // Save chapter under selected novel
    function handleSaveChapter(isDraft) {
        const novelId = document.getElementById('select-novel-target')?.value;
        const chapterTitle = document.getElementById('chapter-title')?.value.trim();
        const content = (document.getElementById('chapter-content')?.value || '').trim();

        if (!novelId) return alert('Hãy chọn một truyện để viết chương');
        if (!chapterTitle || !content) return alert('Vui lòng nhập đủ tên chương và nội dung');

        const novels = getNovels();
        const index = novels.findIndex(n => String(n.id) === String(novelId));
        if (index === -1) return alert('Không tìm thấy truyện');

        novels[index].chapters = novels[index].chapters || [];
        novels[index].chapters.unshift({
            id: Date.now(),
            title: chapterTitle,
            content: content,
            date: new Date().toLocaleDateString('vi-VN'),
            status: isDraft ? 'Nháp' : 'Đã đăng'
        });

        // If publishing a chapter, ensure novel isn't marked as draft
        if (!isDraft && novels[index].status === 'Nháp') novels[index].status = 'Đang tiến hành';

        saveNovels(novels);
        if (isDraft) {
            alert('Đã lưu nháp chương thành công!');
            // keep user on page to continue editing
            document.getElementById('chapter-title').value = '';
            document.getElementById('chapter-content').value = '';
        } else {
            alert('Đã thêm chương mới thành công!');
            // redirect to detail so user can view the chapter
            window.location.href = 'detail.html?id=' + encodeURIComponent(novelId);
        }
    }

    // Wire events to existing IDs in the page (support multiple ID variants)
    document.getElementById('publish-novel-btn')?.addEventListener('click', function(e){ e.preventDefault(); handleCreateNovel('published'); });
    document.getElementById('save-draft-novel-btn')?.addEventListener('click', function(e){ e.preventDefault(); handleCreateNovel('draft'); });
    // Support alternate IDs used elsewhere
    const pubBtn = document.getElementById('publish-btn');
    if (pubBtn) pubBtn.addEventListener('click', (e)=>{ e.preventDefault(); handleCreateNovel('published'); });
    const saveDraftBtn = document.getElementById('save-draft-btn');
    if (saveDraftBtn) saveDraftBtn.addEventListener('click', (e)=>{ e.preventDefault(); handleCreateNovel('draft'); });

    // If editing (novelId in URL), prefill fields
    (function prefillIfEditing(){
        const params = new URLSearchParams(window.location.search);
        const editId = params.get('novelId') || params.get('id');
        if (!editId) return;
        const novels = getNovels();
        const n = novels.find(x => String(x.id) === String(editId));
        if (!n) return;
        document.getElementById('new-title').value = n.title || '';
        document.getElementById('new-author').value = n.author || '';
        document.getElementById('new-category').value = n.category || '';
        document.getElementById('new-cover').value = n.cover || '';
        document.getElementById('new-summary').value = n.summary || '';
    })();
    document.getElementById('save-chapter-btn')?.addEventListener('click', function(e){ e.preventDefault(); handleSaveChapter(false); });
    document.getElementById('save-draft-chapter-btn')?.addEventListener('click', function(e){ e.preventDefault(); handleSaveChapter(true); });

    // Update select on storage changes (other tabs)
    window.addEventListener('storage', (e) => { if (e.key === STORAGE_KEY) refreshNovelSelect(); });

    // Init
    refreshNovelSelect();
})();
</script>
</body></html>
